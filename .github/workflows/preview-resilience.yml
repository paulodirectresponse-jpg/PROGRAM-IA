name: Preview resilience repair
on:
  push:
    paths:
      - '.github/workflows/preview-resilience.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: python3 .github/scripts/preview_resilience.py
      - run: npm run build
      - name: Commit validated preview repair
        run: |
          git config user.name program-ia-preview-repair
          git config user.email actions@users.noreply.github.com
          git add server/routes.ts src/components/WorkspaceArea.tsx
          git commit -m "fix: make live preview resilient and non-blocking"
          git push
