name: Validate Forge application
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORGE_DATA_DIR: .ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npx tsx --test --test-concurrency=1 tests/foundation.test.ts tests/http.test.ts tests/directPersistence.test.ts tests/regression.test.ts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
