name: Final stabilization repair

on:
  push:
    paths:
      - '.github/workflows/final-stabilization.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/final_stabilize.py
      - run: npm test
      - run: npm run build
      - name: Commit validated repair
        run: |
          git config user.name program-ia-stabilizer
          git config user.email actions@users.noreply.github.com
          git add server/agent-engine/agentEngine.ts src/components/AgentsModal.tsx tests/foundation.test.ts tests/phase0.test.ts tests/directPersistence.test.ts tests/http.test.ts
          git commit -m 'fix: finalize routing and regression stabilization'
          git push
